name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the Helix and Procore scan scripts
        run: npm test

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check the Workload Tracker DTOs match the pinned schema
        run: dotnet run --project windows-helper/tools/SmcCaTracker.ContractGen -- check
      - name: Test and build the app
        run: powershell -ExecutionPolicy Bypass -File windows-helper\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SMC-CA-Tracker
          path: windows-helper/dist