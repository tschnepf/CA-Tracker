name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the Helix and Procore scan scripts
        run: npm test

  company-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the company server
        run: python -m unittest discover central -p "test_*.py"

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test and build the app
        run: powershell -ExecutionPolicy Bypass -File windows-helper\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SMC-CA-Tracker
          path: windows-helper/dist