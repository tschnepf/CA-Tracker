name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Standalone checks. The Task Hub server-contract checks (Keycloak realm,
      # .env examples, web packaging) are skipped unless an AnotherTaskManager
      # checkout is available via TASKHUB_REPO_ROOT or as ../AnotherTaskManager.
      - name: Validate and test extension
        run: npm run check
      - name: Package extension
        run: node scripts/package-extension.js
      - uses: actions/upload-artifact@v4
        with:
          name: helix-my-activity
          path: dist/helix-my-activity-*.zip
